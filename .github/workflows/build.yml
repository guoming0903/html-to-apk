          mkdir -p '_android/app/src/main/java/com/htmlapp/wrapper'
          cat > '_android/app/src/main/java/com/htmlapp/wrapper/MainActivity.java' <<'EOF_FILE_6'
          package com.htmlapp.wrapper;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)
                                  || "mailto".equals(scheme) || "tel".equals(scheme)) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, uri));
                              } catch (Exception ignored) {
                                  // no app can handle this link
                              }
                              return true;
                          }
                          return false;
                      }
                  });

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl("file:///android_asset/index.html");
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF_FILE_6
          mkdir -p '_android/app/src/main/res/drawable'
          cat > '_android/app/src/main/res/drawable/ic_launcher.xml' <<'EOF_FILE_7'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1E66F5"
                  android:pathData="M24,10h60a14,14 0 0 1 14,14v60a14,14 0 0 1 -14,14h-60a14,14 0 0 1 -14,-14v-60a14,14 0 0 1 14,-14z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M42,32L42,76L78,54z" />
          </vector>
          EOF_FILE_7

      - name: Customize project
        env:
          APP_NAME_INPUT: "${{ github.event.inputs.app_name }}"
          APP_ID_INPUT: "${{ github.event.inputs.package_name }}"
          REPO: "${{ github.repository }}"
          RUN_NUMBER: "${{ github.run_number }}"
        run: |
          python3 - <<'PY'
          import os, re, html, base64, shutil, sys, pathlib

          root = pathlib.Path("_android")
          app = root / "app"
          assets = app / "src/main/assets"
          assets.mkdir(parents=True, exist_ok=True)

          # 1) the web content: www/ folder (with index.html) or a single index.html
          www, idx = pathlib.Path("www"), pathlib.Path("index.html")
          if (www / "index.html").is_file():
              shutil.copytree(www, assets, dirs_exist_ok=True)
              main_html = www / "index.html"
          elif idx.is_file():
              shutil.copy(idx, assets / "index.html")
              main_html = idx
          else:
              print("::error::index.html not found. Upload your HTML file to the repository root and name it exactly index.html")
              sys.exit(1)

          # 2) app name: workflow input, else the page <title>, else a default
          text = main_html.read_text(encoding="utf-8", errors="ignore")
          m = re.search(r"<title[^>]*>(.*?)</title>", text, re.S | re.I)
          title = html.unescape(m.group(1)) if m else ""
          name = " ".join((os.environ.get("APP_NAME_INPUT", "").strip() or title or "My App").split())[:50]

          # 3) package name: workflow input, else derived from the repository name
          JAVA_KW = {"abstract", "assert", "boolean", "break", "byte", "case", "catch", "char", "class",
                     "const", "continue", "default", "do", "double", "else", "enum", "extends", "final",
                     "finally", "float", "for", "goto", "if", "implements", "import", "instanceof", "int",
                     "interface", "long", "native", "new", "package", "private", "protected", "public",
                     "return", "short", "static", "strictfp", "super", "switch", "synchronized", "this",
                     "throw", "throws", "transient", "try", "void", "volatile", "while", "true", "false", "null"}
          repo = os.environ.get("REPO", "").split("/")[-1].lower()
          slug = re.sub(r"[^a-z0-9]", "", repo) or "app"
          if not slug[0].isalpha():
              slug = "app" + slug
          if slug in JAVA_KW:
              slug += "app"
          app_id = os.environ.get("APP_ID_INPUT", "").strip() or "com.html2apk." + slug
          segments = app_id.split(".")
          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+", app_id) or any(s in JAVA_KW for s in segments):
              print("::error::Invalid package name: " + app_id + " (use letters/digits/underscore, at least two parts, e.g. com.mycompany.mygame)")
              sys.exit(1)


          def xml_str(s):
              s = s.replace("\\", "\\\\").replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
              s = s.replace("'", "\\'").replace('"', '\\"')
              if s[:1] in ("@", "?"):
                  s = "\\" + s
              return s


          values = app / "src/main/res/values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "strings.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">%s</string>\n</resources>\n' % xml_str(name),
              encoding="utf-8")

          # 4) version: bumps on every build so new builds install over old ones
          run = os.environ.get("RUN_NUMBER", "1").strip() or "1"
          g = app / "build.gradle"
          t = g.read_text(encoding="utf-8")
          t = t.replace("__APP_ID__", app_id).replace("__VERSION_CODE__", run).replace("__VERSION_NAME__", "1.0." + run)
          g.write_text(t, encoding="utf-8")

          # 5) fixed signing key (same key every build, so updates install over older versions)
          (app / "debug.keystore").write_bytes(base64.b64decode((app / "debug.keystore.b64").read_text()))

          # 6) optional custom icon: icon.png in the repository root
          if pathlib.Path("icon.png").is_file():
              shutil.copy("icon.png", app / "src/main/res/drawable/ic_launcher.png")
              (app / "src/main/res/drawable/ic_launcher.xml").unlink()

          print("App name:", name)
          print("Package :", app_id)
          print("Version : 1.0." + run, "(code " + run + ")")

          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle -p _android assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp _android/app/build/outputs/apk/debug/app-debug.apk out/app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/app.apk

      - name: Publish release (direct APK download)
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh release create "build-${{ github.run_number }}" out/app.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "APK built from index.html" \
            --target "${{ github.sha }}"
