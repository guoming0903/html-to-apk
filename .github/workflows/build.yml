name: Build APK

# Triggered by the html-to-apk tool (workflow_dispatch). Builds index.html into an APK.
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name (default: the page <title>)'
        required: false
        default: ''
      package_name:
        description: 'Package name, e.g. com.mycompany.mygame (default: derived from repo name)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Android project
        run: |
          mkdir -p '_android'
          cat > '_android/settings.gradle' <<'EOF_FILE_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HtmlApp"
          include ':app'
          EOF_FILE_0
          mkdir -p '_android'
          cat > '_android/build.gradle' <<'EOF_FILE_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE_1
          mkdir -p '_android'
          cat > '_android/gradle.properties' <<'EOF_FILE_2'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF_FILE_2
          mkdir -p '_android/app'
          cat > '_android/app/build.gradle' <<'EOF_FILE_3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.htmlapp.wrapper'
              compileSdk 34

              defaultConfig {
                  applicationId "__APP_ID__"
                  minSdk 24
                  targetSdk 34
                  versionCode __VERSION_CODE__
                  versionName "__VERSION_NAME__"
              }

              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE_3
